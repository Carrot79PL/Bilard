<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilard – podpis A</title>
<style>
  :root{--bg:#0c0d10;--card:#14161b;--tx:#eef1f6;--dim:#8a93a3;--line:#262a33}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,sans-serif;padding:24px 16px}
  h1{font-size:18px;font-weight:600;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:var(--dim);font-size:13px}
  .grid,.wrap{max-width:760px;margin:0 auto}.wrap{margin-bottom:14px}.grid{display:grid;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
  .card h2{font-size:14px;margin:0;font-weight:600}
  .card small{color:var(--dim);font-size:12px;display:block;margin-top:2px}
  button{background:#222733;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
  canvas{display:block;width:100%;height:auto;background:#111418}
</style></head><body>
<div class="wrap"><h1>Podpis A – pisany kreska po kresce</h1>
<p class="sub">Wariant A (Bradley Hand). Pióro idzie po każdej literze osobno, kreska po kresce, z krótkimi przerwami między literami, a na końcu zamach pod całym podpisem.</p></div>
<div class="grid">
 <div class="card"><header><div><h2>A · Bradley Hand, kreska po kresce</h2><small>Prawdziwa kolejność pisania i duży zamach pod podpisem.</small></div><button onclick="rp(0)">Od nowa</button></header><canvas id="c0" width="960" height="540"></canvas></div>
</div>
<script>
const W=960,H=540,DUR=8.2;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), sm=t=>{t=cl(t);return t*t*(3-2*t)}, eo=t=>1-Math.pow(1-cl(t),3);
const B1='#5aa6ff',B2='#2f7bf5',B3='#1f58d6',GR='#34c26b';
function bgc(c){c.fillStyle='#111418';c.fillRect(0,0,W,H);const g=c.createRadialGradient(W/2,H*.42,10,W/2,H*.42,330);g.addColorStop(0,'rgba(46,134,255,.14)');g.addColorStop(.5,'rgba(46,134,255,.05)');g.addColorStop(1,'rgba(46,134,255,0)');c.fillStyle=g;c.fillRect(0,0,W,H)}
function carrot(c,x,y,k){c.save();c.translate(x,y);c.scale(k,k);
  [[B1,0,36,38,24],[B2,44,24,77,13],[B3,82,13,127,0]].forEach(b=>{c.beginPath();c.moveTo(-b[2],b[1]);c.lineTo(b[2],b[1]);c.lineTo(b[4],b[3]);c.lineTo(-b[4],b[3]);c.closePath();c.fillStyle=b[0];c.fill()});
  c.strokeStyle=GR;c.lineWidth=7;c.lineCap='round';[[0,-6,0,-34],[-8,-8,-20,-32],[8,-8,20,-32]].forEach(l=>{c.beginPath();c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3]);c.stroke()});c.restore()}
function ball(c){const x=W/2,y=150,R=70;c.save();c.translate(x,y);c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=24;c.shadowOffsetY=10;c.beginPath();c.arc(0,0,R,0,7);c.fillStyle='#0b0b0d';c.fill();c.shadowColor='transparent';
  c.beginPath();c.arc(0,0,R*.58,0,7);c.fillStyle='#e8e5dc';c.fill();carrot(c,0,-R*.4,.52);
  const g=c.createRadialGradient(-R*.4,-R*.45,4,0,0,R);g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(.22,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.4)');c.beginPath();c.arc(0,0,R,0,7);c.fillStyle=g;c.fill();c.restore()}
// szkielet (1 px) pisma ręcznego: rasteryzacja tekstu -> ścienianie Zhang–Suen -> punkty posortowane od lewej do prawej
function thin(img,w,h){let ch=true;while(ch){ch=false;for(let st=0;st<2;st++){const del=[];
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(!img[i])continue;
    const p2=img[i-w],p3=img[i-w+1],p4=img[i+1],p5=img[i+w+1],p6=img[i+w],p7=img[i+w-1],p8=img[i-1],p9=img[i-w-1];
    const B=p2+p3+p4+p5+p6+p7+p8+p9;if(B<2||B>6)continue;
    let A=0;const q=[p2,p3,p4,p5,p6,p7,p8,p9,p2];for(let k=0;k<8;k++)if(!q[k]&&q[k+1])A++;if(A!==1)continue;
    if(st===0){if(p2*p4*p6)continue;if(p4*p6*p8)continue}else{if(p2*p4*p8)continue;if(p2*p6*p8)continue}
    del.push(i)}
  for(const i of del)img[i]=0;if(del.length)ch=true}}}
function skeleton(spec){
  const w=1100,h=300,cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle='#000';x.textBaseline='alphabetic';
  x.font=`${spec.weight} 100px ${spec.font}`;const m=x.measureText(spec.text).width;const size=100*spec.width/m;
  x.font=`${spec.weight} ${size}px ${spec.font}`;x.save();x.translate(w/2,200);x.transform(1,0,-(spec.skew||0),1,0,0);x.textAlign='center';x.fillText(spec.text,0,0);x.restore();
  const d=x.getImageData(0,0,w,h).data;const img=new Uint8Array(w*h);for(let i=0;i<w*h;i++)img[i]=d[i*4]<128?1:0;
  thin(img,w,h);const pts=[];for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)if(img[yy*w+xx])pts.push([xx-w/2,yy-200]);
  pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);return pts}
// kolejność pisania: składowe (litery) od lewej do prawej, w obrębie litery przejście po szkielecie "najprostszą" ścieżką
function trace(pts){
  const key=(x,y)=>x*4096+(y+2048);const map=new Map();pts.forEach((p,i)=>map.set(key(p[0]+600,p[1]),i));
  const nb=(i)=>{const p=pts[i],r=[];for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;const j=map.get(key(p[0]+600+dx,p[1]+dy));if(j!==undefined)r.push(j)}return r};
  const comp=new Int32Array(pts.length).fill(-1);const comps=[];
  for(let i=0;i<pts.length;i++){if(comp[i]>=0)continue;const id=comps.length,st=[i],list=[];comp[i]=id;while(st.length){const c=st.pop();list.push(c);for(const j of nb(c))if(comp[j]<0){comp[j]=id;st.push(j)}}comps.push(list)}
  const cs=comps.filter(l=>l.length>3).map(l=>({l,x:Math.min(...l.map(i=>pts[i][0])),y:Math.min(...l.map(i=>pts[i][1]))}));
  // kropki (małe składowe) piszemy zaraz po literze, do której należą; reszta od lewej do prawej
  cs.sort((a,b)=>a.x-b.x);
  const order=[];const vis=new Uint8Array(pts.length);
  for(const c of cs){
    let start=c.l[0],best=1e9;for(const i of c.l){const n=nb(i).length;const score=pts[i][0]+(n===1?0:40)+pts[i][1]*0.15;if(score<best){best=score;start=i}}
    let cur=start,dir=[1,0];const junc=[];vis[cur]=1;order.push({i:cur,jump:true});
    for(;;){
      const un=nb(cur).filter(j=>!vis[j]);
      if(!un.length){let found=false;while(junc.length){const j=junc.pop();if(nb(j).some(q=>!vis[q])){cur=j;found=true;order.push({i:cur,jump:true});break}}if(!found)break;continue}
      let bj=un[0],bs=-9;for(const j of un){const dx=pts[j][0]-pts[cur][0],dy=pts[j][1]-pts[cur][1],l=Math.hypot(dx,dy)||1;const s=(dx*dir[0]+dy*dir[1])/l+(dx>0?.15:0);if(s>bs){bs=s;bj=j}}
      if(un.length>1)junc.push(cur);
      const dx=pts[bj][0]-pts[cur][0],dy=pts[bj][1]-pts[cur][1],l=Math.hypot(dx,dy)||1;dir=[dir[0]*.6+dx/l*.4,dir[1]*.6+dy/l*.4];
      cur=bj;vis[cur]=1;order.push({i:cur,jump:false})}
  }
  return order}
const SKP=skeleton({weight:700,font:"'Bradley Hand','Noteworthy',cursive",text:'Tomasz Marchewka',width:730,skew:.16});
const ORD=trace(SKP);
const CUM=[];(()=>{let t=0;ORD.forEach(o=>{t+=o.jump?9:1;CUM.push(t)})})();
const TOT=CUM[CUM.length-1];
let XA=1e9,XB=-1e9;SKP.forEach(p=>{XA=Math.min(XA,p[0]);XB=Math.max(XB,p[0])});
function write(c,t,baseY){
  const t0=.9,dur=3.4;const k=cl((t-t0)/dur);const p=k<1?(k*.8+(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2)*.2):1;const lim=TOT*p;
  c.save();c.translate(W/2,baseY);c.shadowColor='rgba(120,170,255,.55)';c.shadowBlur=7;c.strokeStyle='#f6f8fd';c.lineWidth=3.6;c.lineCap='round';c.lineJoin='round';
  let last=null,open=false;c.beginPath();
  for(let n=0;n<ORD.length&&CUM[n]<=lim;n++){const q=SKP[ORD[n].i];if(ORD[n].jump){c.moveTo(q[0],q[1])}else c.lineTo(q[0],q[1]);last=q}
  c.stroke();
  if(k>0&&k<1&&last){c.shadowBlur=0;const g=c.createRadialGradient(last[0],last[1],0,last[0],last[1],28);g.addColorStop(0,'rgba(190,220,255,.95)');g.addColorStop(1,'rgba(120,170,255,0)');c.fillStyle=g;c.fillRect(last[0]-32,last[1]-32,64,64)}
  c.restore()}
// duży zamach: pętla za ostatnią literą i długa fala pod całym podpisem, kończąca się pętelką pod "T"
function cr(p0,p1,p2,p3,u){const u2=u*u,u3=u2*u;return [0,1].map(i=>.5*((2*p1[i])+(-p0[i]+p2[i])*u+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*u2+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*u3))}
function swoosh(c,t,baseY){const p=cl((t-4.5)/1.0);if(p<=0)return;
  const xa=XA,xb=XB;const P=[[xb-10,6],[xb+30,-16],[xb+60,8],[xb+30,42],[xb-90,52],[xb-290,40],[xb-480,46],[xa+150,50],[xa+60,42],[xa+20,60],[xa+70,74],[xa+120,56]];
  const S=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];for(let k=0;k<20;k++)S.push(cr(p0,p1,p2,p3,k/20))}
  const n=Math.floor(S.length*(p<1?p*p*(3-2*p):1));
  c.save();c.translate(W/2,baseY);c.strokeStyle='#f6f8fd';c.lineCap='round';c.lineJoin='round';c.shadowColor='rgba(120,170,255,.55)';c.shadowBlur=7;
  for(let i=1;i<n;i++){const u=i/S.length;c.lineWidth=2.0+2.0*Math.sin(Math.min(1,u*1.6)*Math.PI*.9);c.beginPath();c.moveTo(S[i-1][0],S[i-1][1]);c.lineTo(S[i][0],S[i][1]);c.stroke()}
  if(p<1&&n>1){c.shadowBlur=0;const h=S[n-1];const g=c.createRadialGradient(h[0],h[1],0,h[0],h[1],26);g.addColorStop(0,'rgba(190,220,255,.95)');g.addColorStop(1,'rgba(120,170,255,0)');c.fillStyle=g;c.fillRect(h[0]-30,h[1]-30,60,60)}
  c.restore()}
function studio(c,t,y){const a=sm((t-5.4)/.8);if(a<=0)return;c.save();c.globalAlpha=a;c.textAlign='center';c.fillStyle=B1;c.font='700 22px -apple-system,Helvetica';c.letterSpacing='16px';c.fillText('STUDIO',W/2+8,y);c.restore()}
function d0(c,t){bgc(c);ball(c);write(c,t,346);swoosh(c,t,346);studio(c,t,468)}
const fn=[d0],cx=[0].map(i=>document.getElementById('c'+i).getContext('2d')),T=[0];
const now=()=>performance.now()/1000;function rp(i){T[i]=now()}[0].forEach(rp);
function loop(){for(let i=0;i<1;i++){const t=(now()-T[i])%DUR;const c=cx[i];c.save();c.clearRect(0,0,W,H);fn[i](c,t);const f=cl((t-(DUR-.5))/.5);if(f>0){c.fillStyle=`rgba(17,20,24,${f})`;c.fillRect(0,0,W,H)}c.restore()}requestAnimationFrame(loop)}
loop();
</script></body></html>
